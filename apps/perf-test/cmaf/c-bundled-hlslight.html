<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMAF · C · Bundled SPF + hls.light</title>
    <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
    <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
  </head>
  <body>
    <div class="shell">
      <h1>CMAF · C — Bundled SPF + hls.light</h1>
      <div class="meta">
        Both engines bundled (<code>dual-hls-light-video</code>) with hls.light in place of full
        hls.js. Same router picks SPF for CMAF. Measures the lighter bundle tax on the happy path.
      </div>
      <div id="root"></div>
    </div>

    <script type="module">
      import { attachMediaTiming, markPhase, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
      import { CMAF_SOURCE } from '/apps/perf-test/_shared/sources.js';

      await import('/packages/html/cdn/video-minimal.js');
      await import('/packages/html/cdn/media/dual-hls-light-video.js');
      markPhase('hlsjs-loaded');

      const root = document.getElementById('root');
      root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <dual-hls-light-video id="dual" src="${CMAF_SOURCE.url}" autoplay muted preload="auto" playsinline crossorigin="anonymous"></dual-hls-light-video>
          </video-minimal-skin>
        </video-player>
      `;
      markPlayerReady();

      const dual = root.querySelector('dual-hls-light-video');
      attachMediaTiming(dual.media, { autoplay: true });
    </script>
  </body>
</html>
