<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TC-01 · No Autoplay · Config A (SPF)</title>
  <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
  <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
</head>

<body>
  <div class="shell">
    <h1>TC-01 · No Autoplay · Config A — SPF</h1>
    <div class="meta">CMAF asset. Page loads, player initializes, no playback.</div>
    <div id="root"></div>
  </div>

  <script type="module">
    import { attachMediaTiming, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
    import { CMAF_SOURCE } from '/apps/perf-test/_shared/sources.js';

    await import('/packages/html/cdn/video-minimal.js');
    await import('/packages/html/cdn/media/simple-hls-video.js');

    const root = document.getElementById('root');
    root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <simple-hls-video src="${CMAF_SOURCE.url}" preload="auto" playsinline crossorigin="anonymous"></simple-hls-video>
          </video-minimal-skin>
        </video-player>
      `;
    markPlayerReady();
    attachMediaTiming(root.querySelector('simple-hls-video'), { autoplay: false });
  </script>
</body>

</html>
