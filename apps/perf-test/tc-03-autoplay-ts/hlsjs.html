<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TC-03 · Autoplay TS · Config B (HLS.js)</title>
    <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
    <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
  </head>
  <body>
    <div class="shell">
      <h1>TC-03 · Autoplay TS · Config B — HLS.js</h1>
      <div class="meta">
        MPEG-TS asset. Autoplay muted; capture first frame. SPF (Config A) cannot
        play TS, so this case is HLS.js only — it documents the real-world floor
        for legacy TS customers.
      </div>
      <div id="root"></div>
    </div>

    <script type="module">
      import { attachMediaTiming, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
      import { TS_SOURCE } from '/apps/perf-test/_shared/sources.js';

      await import('/packages/html/cdn/video-minimal.js');
      await import('/packages/html/cdn/media/hls-video.js');

      const root = document.getElementById('root');
      root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <hls-video src="${TS_SOURCE.url}" autoplay muted preload="auto" playsinline crossorigin="anonymous"></hls-video>
          </video-minimal-skin>
        </video-player>
      `;
      markPlayerReady();
      attachMediaTiming(root.querySelector('hls-video'), { autoplay: true });
    </script>
  </body>
</html>
