<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TC-06 · Autoplay CMAF · Config C (hls.light)</title>
    <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
    <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
  </head>
  <body>
    <div class="shell">
      <h1>TC-06 · Autoplay CMAF · Config C — hls.light</h1>
      <div class="meta">
        CMAF asset. Same architecture as TC-02 Config B with hls.js swapped for hls.light at bundle time.
      </div>
      <div id="root"></div>
    </div>

    <script type="module">
      import { attachMediaTiming, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
      import { CMAF_SOURCE } from '/apps/perf-test/_shared/sources.js';

      await import('/packages/html/cdn/video-minimal.js');
      await import('/packages/html/cdn/media/hls-light-video.js');

      const root = document.getElementById('root');
      root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <hls-light-video src="${CMAF_SOURCE.url}" autoplay muted preload="auto" playsinline crossorigin="anonymous"></hls-light-video>
          </video-minimal-skin>
        </video-player>
      `;
      markPlayerReady();
      attachMediaTiming(root.querySelector('hls-light-video'), { autoplay: true });
    </script>
  </body>
</html>
