<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TC-07 · Sequenced lazy load · Config D (SPF → hls.js)</title>
    <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
    <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
  </head>
  <body>
    <div class="shell">
      <h1>TC-07 · Sequenced lazy · Config D — SPF → HLS.js</h1>
      <div class="meta">
        SPF media element mounts first. After a 20 ms mocked format-detection endpoint
        returns "TS", the page dynamically imports the full HLS.js bundle and swaps in
        <code>&lt;hls-video&gt;</code> to play the TS source.
      </div>
      <div id="root"></div>
    </div>

    <script type="module">
      import { attachMediaTiming, markPhase, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
      import { TS_SOURCE } from '/apps/perf-test/_shared/sources.js';

      // Phase 1 — SPF + player shell load.
      await import('/packages/html/cdn/video-minimal.js');
      await import('/packages/html/cdn/media/simple-hls-video.js');

      const root = document.getElementById('root');
      // Mount the SPF media element with no src — satisfies "media element
      // mounted before sequenced load begins" while keeping the engine idle.
      root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <simple-hls-video id="initial" playsinline crossorigin="anonymous"></simple-hls-video>
          </video-minimal-skin>
        </video-player>
      `;
      markPhase('spf-init');
      markPlayerReady();

      // Phase 2 — mocked format-detection endpoint (20 ms simulated latency).
      // In production this would be an HTTP call that returns the content
      // type; here we hardcode "ts" so the lazy path always runs.
      const format = await new Promise((resolve) => {
        setTimeout(() => resolve('ts'), 20);
      });
      markPhase('endpoint-response');

      // Phase 3 — lazy-import the full HLS.js media-element bundle.
      if (format === 'ts') {
        await import('/packages/html/cdn/media/hls-video.js');
        markPhase('hlsjs-loaded');

        // Phase 4 — swap the SPF element out for <hls-video> with the TS source.
        // Replacing the element preserves the surrounding skin/player shell.
        const initial = document.getElementById('initial');
        const hlsVideo = document.createElement('hls-video');
        hlsVideo.id = 'media';
        hlsVideo.setAttribute('autoplay', '');
        hlsVideo.setAttribute('muted', '');
        hlsVideo.setAttribute('preload', 'auto');
        hlsVideo.setAttribute('playsinline', '');
        hlsVideo.setAttribute('crossorigin', 'anonymous');
        hlsVideo.setAttribute('src', TS_SOURCE.url);
        initial.replaceWith(hlsVideo);

        attachMediaTiming(hlsVideo, { autoplay: true });
      }
    </script>
  </body>
</html>
