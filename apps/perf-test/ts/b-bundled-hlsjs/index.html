<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS · B · Bundled SPF + hls.js</title>
    <link rel="stylesheet" href="/apps/perf-test/_shared/styles.css" />
    <link rel="stylesheet" href="/packages/skins/dist/default/minimal/css/video.css" />
  </head>

  <body>
    <div class="shell">
      <h1>TS · B — Bundled SPF + hls.js</h1>
      <div class="meta">
        Both engines bundled into a single CDN entry (<code>dual-hls-video</code>). The
        <code>prefer-hlsjs</code> attribute tells the element to pick HLS.js at construction time —
        no lazy load, no detection delay. Models a "ship both, pick on a flag" architecture.
      </div>
      <div id="root"></div>
    </div>

    <script type="module">
      import { attachMediaTiming, markPhase, markPlayerReady } from '/apps/perf-test/_shared/perf.js';
      import { TS_SOURCE } from '/apps/perf-test/_shared/sources.js';

      await import('/packages/html/cdn/video-minimal.js');
      await import('/packages/html/cdn/media/dual-hls-video.js');
      markPhase('hlsjs-loaded');

      const root = document.getElementById('root');
      root.innerHTML = `
        <video-player>
          <video-minimal-skin>
            <dual-hls-video id="dual" prefer-hlsjs src="${TS_SOURCE.url}" autoplay muted preload="auto" playsinline crossorigin="anonymous"></dual-hls-video>
          </video-minimal-skin>
        </video-player>
      `;
      markPlayerReady();

      // The router exposes its inner media element as `.media`. The 'playing'
      // event fires on the inner element and doesn't bubble, so attach the
      // timing listener directly to it.
      const dual = root.querySelector('dual-hls-video');
      attachMediaTiming(dual.media, { autoplay: true });
    </script>
  </body>
</html>
